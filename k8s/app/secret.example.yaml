# PLANTILLA del Secret de la app. El real se crea imperativo (k8s/README.md):
#
#   kubectl -n centralsm create secret generic app-secrets \
#     --from-literal=DATABASE_URL='postgresql://centralsm:centralsm@host.docker.internal:5433/centralsm?schema=public' \
#     --from-literal=TEAMPLACE_CLIENT_ID='...' \
#     --from-literal=TEAMPLACE_CLIENT_SECRET='...'
#
# La app NO lleva las credenciales FINNEGANS_* — esas son solo del worker.
apiVersion: v1
kind: Secret
metadata:
  name: app-secrets
  namespace: centralsm
type: Opaque
stringData:
  DATABASE_URL: "postgresql://centralsm:centralsm@host.docker.internal:5433/centralsm?schema=public"
  TEAMPLACE_CLIENT_ID: "CAMBIAME"
  TEAMPLACE_CLIENT_SECRET: "CAMBIAME"
