apiVersion: apps/v1
kind: Deployment
metadata:
  name: centralsm-app
  namespace: centralsm
  labels:
    app: centralsm-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: centralsm-app
  template:
    metadata:
      labels:
        app: centralsm-app
    spec:
      # fsGroup: los volúmenes montados llegan con dueño root, pero la app
      # corre como usuario `nextjs` (uid 999, grupo nodejs gid 999) y tiene
      # que poder ESCRIBIR en /app/uploads. Con fsGroup, kubelet le da ese
      # grupo (y permiso de grupo) al contenido del volumen al montarlo.
      securityContext:
        fsGroup: 999
      # ── initContainer: migraciones ──────────────────────────────────────
      # Corre ANTES que el contenedor principal y el pod no arranca hasta que
      # termine bien. Es el lugar canónico para `prisma migrate deploy`: si la
      # migración falla, la app nueva no llega a levantar (y con réplicas,
      # evita que cada pod corra la migración en paralelo... casi: con N
      # réplicas nuevas a la vez sigue habiendo carrera; `migrate deploy` es
      # idempotente y usa lock advisory, así que en la práctica es seguro).
      #
      # Reusamos la imagen del worker: ya tiene el CLI de prisma, el schema y
      # prisma.config.ts adentro. La app standalone no los tiene (a propósito:
      # es una imagen mínima).
      initContainers:
        - name: migrate
          image: centralsm-worker:0.1
          imagePullPolicy: IfNotPresent
          command: ["npx", "prisma", "migrate", "deploy"]
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: DATABASE_URL
      containers:
        - name: app
          # docker build --target production -t centralsm-app:0.1 .
          image: centralsm-app:0.1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          envFrom:
            - configMapRef:
                name: app-config
            - secretRef:
                name: app-secrets
          volumeMounts:
            - name: uploads
              mountPath: /app/uploads
          # ── Probes: cómo sabe k8s que la app está viva y lista ──────────
          # readiness: "¿puede recibir tráfico?" — hasta que no responda, el
          #   Service no le manda requests. Clave en deploys: el pod nuevo no
          #   recibe tráfico hasta estar listo.
          # liveness: "¿sigue viva?" — si falla varias veces seguidas, k8s
          #   REINICIA el contenedor. Por eso es más laxa (períodos largos):
          #   una liveness agresiva mata pods sanos bajo carga.
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 20
            failureThreshold: 3
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              memory: 1Gi
      volumes:
        - name: uploads
          persistentVolumeClaim:
            claimName: app-uploads
