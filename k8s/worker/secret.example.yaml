# PLANTILLA del Secret con las credenciales del worker. El Secret REAL no se
# commitea nunca: crealo de forma imperativa con kubectl (ver k8s/README.md):
#
#   kubectl -n centralsm create secret generic finnegans-creds \
#     --from-literal=FINNEGANS_USER='...' \
#     --from-literal=FINNEGANS_PASSWORD='...' \
#     --from-literal=FINNEGANS_WORKSPACE='...' \
#     --from-literal=DATABASE_URL='postgresql://centralsm:centralsm@host.docker.internal:5433/centralsm?schema=public'
#
# ⚠️ Lección importante: un Secret NO está cifrado, solo codificado en base64
# (probá: kubectl -n centralsm get secret finnegans-creds -o yaml). La
# diferencia con un ConfigMap es de permisos/manejo, no de criptografía.
# `stringData` permite escribir los valores en texto plano; kubectl los
# codifica al aplicar.
apiVersion: v1
kind: Secret
metadata:
  name: finnegans-creds
  namespace: centralsm
type: Opaque
stringData:
  FINNEGANS_USER: "CAMBIAME"
  FINNEGANS_PASSWORD: "CAMBIAME"
  FINNEGANS_WORKSPACE: "CAMBIAME"
  # host.docker.internal = el host Windows visto desde adentro del cluster de
  # Docker Desktop. 5433 es el puerto publicado por el Postgres de compose.
  DATABASE_URL: "postgresql://centralsm:centralsm@host.docker.internal:5433/centralsm?schema=public"
