# Deployment: le declara a Kubernetes "quiero N réplicas de este pod corriendo
# siempre". Si el pod muere (crash, nodo caído, `kubectl delete pod`), el
# Deployment crea otro. Es el `restart: unless-stopped` de compose, con esteroides.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: finnegans-worker
  namespace: centralsm
  labels:
    app: finnegans-worker
spec:
  # 1 réplica A PROPÓSITO: el worker procesa de a un job (Chromium es pesado y
  # la sesión cacheada del bot no se comparte entre pods). El claim atómico
  # toleraría más réplicas, pero no las necesitamos.
  replicas: 1
  selector:
    matchLabels:
      app: finnegans-worker # así encuentra el Deployment a "sus" pods
  # strategy Recreate: mata el pod viejo ANTES de crear el nuevo. El default
  # (RollingUpdate) levantaría los dos a la vez un rato — con replicas:1 y un
  # bot con sesión propia, mejor nunca tener dos corriendo.
  strategy:
    type: Recreate
  template: # ← la "receta" del pod que el Deployment mantiene vivo
    metadata:
      labels:
        app: finnegans-worker
    spec:
      # Al apagar un pod, k8s manda SIGTERM y espera hasta este tiempo antes de
      # matarlo con SIGKILL. El worker termina el job en curso al recibir
      # SIGTERM (worker/index.ts), y un alta tarda ~1-2 min: 180 s da margen.
      # Esto es lo que pasa en cada `kubectl rollout restart`.
      terminationGracePeriodSeconds: 180
      containers:
        - name: worker
          # Imagen construida localmente: docker build -f Dockerfile.worker -t centralsm-worker:0.1 .
          image: centralsm-worker:0.1
          # ⚠️ El tropiezo #1 en Docker Desktop: sin esto, k8s intenta bajar la
          # imagen de Docker Hub (donde no existe) y da ImagePullBackOff.
          # IfNotPresent = usá la imagen local si ya está.
          imagePullPolicy: IfNotPresent
          # Toda la config entra como variables de entorno desde el ConfigMap
          # (no sensible) y el Secret (credenciales).
          envFrom:
            - configMapRef:
                name: worker-config
            - secretRef:
                name: finnegans-creds
          # Estado efímero del bot (sesión + capturas) en /data, como declara
          # Dockerfile.worker. emptyDir = disco vacío que vive lo que el pod;
          # perderlo solo cuesta un re-login automático.
          volumeMounts:
            - name: data
              mountPath: /data
          # requests = lo que k8s le reserva al pod para decidir dónde ubicarlo;
          # limits = techo duro (pasarse de memoria = OOMKilled). Chromium pide
          # bastante: si ves OOMKilled en `kubectl describe pod`, subí el limit.
          resources:
            requests:
              cpu: 250m # 0.25 de CPU
              memory: 512Mi
            limits:
              memory: 1536Mi
      volumes:
        - name: data
          emptyDir: {}
